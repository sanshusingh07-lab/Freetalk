version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freetalk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: freetalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freetalk-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/freetalk?schema=public
      - JWT_SECRET=freetalk_production_jwt_secret_key_change_me_2026
      - COOKIE_SECRET=freetalk_production_cookie_secret_key_change_me
      - FRONTEND_URL=http://localhost:5000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - postgres

volumes:
  postgres_data:
